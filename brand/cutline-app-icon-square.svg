<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cutline logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0b1f5c"/>
    </linearGradient>
    <!-- the two halves of the C, split along a diagonal "cut line" -->
    <clipPath id="upper"><polygon points="0,0 462,0 50,512 0,512"/></clipPath>
    <clipPath id="lower"><polygon points="462,0 512,0 512,512 50,512"/></clipPath>
    <path id="c" d="M 344.3 187 A 112 112 0 1 0 344.3 325" fill="none" stroke-width="56" stroke-linecap="round"/>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <!-- upper-left half: slides up-right and away from the cut -->
  <g clip-path="url(#upper)">
    <use href="#c" stroke="#ffffff" transform="translate(2.5 -17)"/>
  </g>
  <!-- lower-right half: slides down-left and away from the cut -->
  <g clip-path="url(#lower)">
    <use href="#c" stroke="#7dd3fc" transform="translate(-2.5 17)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
